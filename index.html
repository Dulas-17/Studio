<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebDroid</title>
<style>
:root{--accent:#a9c7ff;--text:#f5f6ff;--muted:#aab3c8;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#080c15;color:var(--text);font:14px Arial,Helvetica,sans-serif;display:flex;justify-content:center;align-items:center}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
#phone{width:100%;height:100%;max-width:430px;max-height:920px;position:relative;overflow:hidden;background:linear-gradient(150deg,#1a2a52,#171c37 55%,#0c1424)}
@media(min-width:500px){#phone{height:min(900px,calc(100% - 30px));border-radius:36px;border:5px solid #293043}}
.st{height:36px;padding:10px 20px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:bold;position:relative;z-index:40;cursor:pointer}
#home{position:absolute;inset:36px 0 52px;padding:10px 20px;overflow:auto}
.clk{text-align:center;margin:20px 0 28px;font-size:64px;font-weight:300}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 6px}
.ic{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;padding:0}
.ic i{font-style:normal;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:25px;background:var(--c)}
.win{position:absolute;inset:36px 0 52px;background:#111827;display:none;flex-direction:column;z-index:10}.win.on{display:flex}
.hd{padding:12px 18px;border-bottom:1px solid #ffffff14}.hd h2{margin:0;font-size:17px}
.body{flex:1;overflow:auto;padding:14px}
.nav{position:absolute;bottom:0;left:0;right:0;height:52px;display:flex;justify-content:space-around;background:#0a0f1c;z-index:50}
.nav button{border:0;background:none;font-size:20px;width:80px}
.card{background:#ffffff0d;border:1px solid #ffffff12;border-radius:16px;padding:12px;margin-bottom:10px}
.btn{border:0;background:var(--accent);color:#15213a;border-radius:12px;padding:10px 13px;font-weight:bold}
.btn.secondary{background:#ffffff16;color:#fff}.btn.danger{background:#9d4052;color:#fff}
.field{width:100%;padding:11px 12px;background:#ffffff0f;border:1px solid #ffffff24;border-radius:12px;margin:6px 0 10px;outline:0}
textarea.field{min-height:200px}select option{background:#182136}
.small{font-size:12px;color:var(--muted)}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.grow{flex:1}
h3{margin:12px 0}
.modal{position:absolute;inset:0;z-index:120;background:#000a;display:grid;place-items:center;padding:20px}
.dlg{background:#1b2438;border-radius:22px;padding:20px;width:100%;text-align:center;display:flex;flex-direction:column;gap:8px}
.ov{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1020;padding:20px;text-align:center}
.shade{position:absolute;inset:36px 0 52px;z-index:45;background:#0a0f1cf5;padding:16px;overflow:auto}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:12px;margin-top:20px}.pad button{height:64px;border-radius:50%;border:0;background:#ffffff14;font-size:22px}
.term{background:#050a0a;color:#9df5b0;font:12px monospace;padding:10px;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:240px;margin-bottom:8px}
.cam{width:100%;aspect-ratio:3/4;background:#000;border-radius:16px;object-fit:cover}
#toast{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:130;background:#f1f3fa;color:#192136;padding:10px 16px;border-radius:18px;font-size:13px;max-width:90%;text-align:center}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:200;opacity:0}
#home,.nav,#st,#dock{touch-action:none}#home{padding-bottom:110px}
.win{animation:up .2s ease-out}@keyframes up{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.srch{display:flex;gap:8px;background:#ffffff1c;border:1px solid #ffffff2c;border-radius:24px;padding:11px 14px;margin-bottom:22px}.srch input{flex:1;background:none;border:0;outline:0;min-width:0}
.dock{position:absolute;left:14px;right:14px;bottom:62px;z-index:5;background:#ffffff1c;backdrop-filter:blur(18px);border:1px solid #ffffff18;border-radius:26px;padding:11px 6px;display:flex;justify-content:space-around}
.drawer{position:absolute;inset:36px 0 52px;z-index:44;background:#0c1220f2;backdrop-filter:blur(22px);padding:16px;overflow:auto;animation:up .2s}
.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.q{border:0;border-radius:18px;background:#ffffff12;padding:14px 10px;text-align:left;min-height:74px;font-size:12px}.q.on{background:var(--accent);color:#17223a}.q i{font-style:normal;display:block;font-size:20px;margin-bottom:6px}
.sw{width:42px;height:24px;border-radius:14px;border:0;background:#434c60;padding:3px;text-align:left}.sw::after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(18px);background:#25324b}
.rc{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory}.rcard{flex:0 0 70%;scroll-snap-align:center;background:#1a2338;border-radius:20px;padding:14px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal span{padding:8px 0;border-radius:10px;font-size:13px}.cal .t{background:var(--accent);color:#17223a}.cal .r{border:1px solid var(--accent)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cg button{border:0;border-radius:14px;background:#ffffff14;height:56px;font-size:19px}.cg .o{background:#293957}.cg .e{background:var(--accent);color:#17223a}.nm *{animation:none!important;transition:none!important}
.win{animation:zin .3s cubic-bezier(.2,.8,.2,1);transform-origin:var(--ox,50%) var(--oy,90%)}
@keyframes zin{from{transform:scale(.25);opacity:0;border-radius:40px}to{transform:none;opacity:1}}
.win.out{display:flex!important;animation:zout .2s ease-in forwards;pointer-events:none}
@keyframes zout{to{transform:scale(.25);opacity:0;border-radius:40px}}
#home:not([hidden]),#dock:not([hidden]){animation:hin .3s ease-out}
@keyframes hin{from{transform:scale(1.07);opacity:.5}to{transform:none;opacity:1}}
.ic{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.ic i{transition:transform .15s}.ic:active i{transform:scale(.86)}
.shade{animation:sd .2s ease-out}@keyframes sd{from{transform:translateY(-24px);opacity:0}to{transform:none;opacity:1}}
.dlg{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}#toast{animation:pop .18s}
.dlg{max-height:100%;overflow:auto}
.ic{position:relative}.xb{position:absolute;top:-6px;left:calc(50% - 38px);width:22px;height:22px;border-radius:50%;background:#9d4052;color:#fff;font-size:16px;line-height:1;display:grid;place-items:center;border:2px solid #0b1020;z-index:2}
.edit .ic{animation:wig .22s infinite alternate}@keyframes wig{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.ic.sel i{outline:2px solid var(--accent);outline-offset:3px}.ic.new i{animation:newp .6s 3}@keyframes newp{50%{transform:scale(1.2)}}
.lr{display:flex;align-items:center;gap:12px;padding:13px;border-radius:16px;background:#ffffff0d;margin-bottom:8px;cursor:pointer}.lr .i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#ffffff18;font-size:18px}
.seg{display:flex;background:#ffffff12;border-radius:10px;padding:2px}.seg button{border:0;background:none;padding:6px 9px;border-radius:8px;font-size:12px}.seg button.on{background:var(--accent);color:#17223a}
.bar{height:6px;background:#ffffff1c;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);animation:fill .9s ease-out forwards}@keyframes fill{from{width:0}to{width:100%}}
.rcard{flex:0 0 72%;scroll-snap-align:center;background:#1a2338;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 45%,#1a2338),#141b2e);border:1px solid #ffffff1c;border-radius:26px;padding:14px;animation:cin .35s cubic-bezier(.2,.8,.2,1) backwards;touch-action:pan-x;transition:transform .2s,opacity .2s}
.rh{display:flex;gap:10px;align-items:center}.rp{height:230px;display:grid;place-items:center;border-radius:18px;background:#00000030;margin:12px 0}.rcard.gone{transform:translateY(-130%);opacity:0}@keyframes cin{from{transform:translateX(60px) scale(.9);opacity:0}}
/* frosted glass + fluid motion */
.win{background:rgba(14,20,36,.62);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);animation-duration:.38s;animation-timing-function:cubic-bezier(.22,1.1,.36,1)}
.hd{background:#ffffff0d}
.card,.lr{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.nav{background:rgba(10,15,28,.45);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-top:1px solid #ffffff14}
.st{text-shadow:0 1px 6px #0006}
.dock{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);box-shadow:inset 0 1px 0 #ffffff33,0 14px 30px #0004}
.shade,.drawer{background:rgba(10,16,30,.5)!important;backdrop-filter:blur(34px) saturate(1.6);-webkit-backdrop-filter:blur(34px) saturate(1.6)}
.dlg{background:rgba(30,40,64,.62);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:1px solid #ffffff2a;box-shadow:inset 0 1px 0 #ffffff2a,0 20px 50px #0006}
.modal{backdrop-filter:blur(6px)}
#lock{background:rgba(8,12,24,.38);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5)}
#toast{background:rgba(240,243,250,.78);backdrop-filter:blur(14px)}
.field{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.btn.secondary,.q{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}.q.on{background:var(--accent);border-color:transparent}
.rcard{backdrop-filter:blur(18px)}
.btn,.lr,.q{transition:transform .14s cubic-bezier(.3,1.4,.5,1),filter .14s}.btn:active,.lr:active,.q:active{transform:scale(.96)}
.body>*{animation:fin .32s cubic-bezier(.22,1,.36,1) backwards}.body>*:nth-child(2){animation-delay:.04s}.body>*:nth-child(3){animation-delay:.08s}.body>*:nth-child(4){animation-delay:.12s}.body>*:nth-child(n+5){animation-delay:.16s}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
.sv *{backdrop-filter:none!important}
</style></head><body>
<div id="phone">
<div class="st" id="st"><span id="tm">--:--</span><span><span id="ind"></span> <span id="bell"></span> <span id="bat">▰</span></span></div>
<main id="home" hidden><div class="clk" id="hc"></div><div class="small" id="hd" style="text-align:center;margin:-22px 0 20px"></div><form class="srch" id="sf"><span>⌕</span><input id="sq" placeholder="Search apps or the web" autocomplete="off"></form><div class="grid" id="grid"></div></main>
<div class="dock" id="dock" hidden></div>
<div id="wins"></div>
<div class="shade" id="shade" hidden></div><div class="shade" id="recents" hidden></div><div class="drawer" id="drawer" hidden></div>
<nav class="nav"><button id="nb">◁</button><button id="nh">○</button><button id="nr">□</button></nav>
<div class="ov" id="lock" hidden></div>
<div class="ov" id="boot" style="z-index:100"><div class="bl"><div class="bh"><i></i><i></i></div></div><h1>Web<b>Droid</b></h1><div class="bt"><i></i></div><pre></pre></div>
<div id="toast" hidden></div><div id="dim"></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem={},T0=Date.now();
const LS={get(k,d){if(k in mem)return mem[k];try{const v=localStorage.getItem("wos3_"+k);return v==null?d:JSON.parse(v)}catch{return d}},
 set(k,v){mem[k]=v;if(db&&BIG(k)){idbQueue(k);return true}try{localStorage.setItem("wos3_"+k,JSON.stringify(v));return true}catch{return false}}};
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2400)}

/* ---------- Kernel: virtual file system ---------- */
const guard=p=>{if(p==="/"||p==="/system"||p.startsWith("/system/"))throw Error("Permission denied (read-only)")};
const FS={
 root:LS.get("fs",null)||{t:"d",c:{home:{t:"d",c:{user:{t:"d",c:{Documents:{t:"d",c:{"welcome.txt":{t:"f",d:"Welcome to Web OS 3.\nFiles persist in browser storage.",m:Date.now()}}},Pictures:{t:"d",c:{}},Downloads:{t:"d",c:{}}}}}},system:{t:"d",c:{version:{t:"f",d:"WebDroid",m:Date.now()}}}}},
 norm(p,cwd="/"){const o=[];for(const s of(p.startsWith("/")?p:cwd+"/"+p).split("/")){if(!s||s===".")continue;s===".."?o.pop():o.push(s)}return"/"+o.join("/")},
 node(p){let n=this.root;for(const s of p.split("/").filter(Boolean)){if(n.t!=="d"||!n.c[s])return null;n=n.c[s]}return n},
 parent(p){const a=p.split("/").filter(Boolean),n=a.pop();return[this.node("/"+a.join("/")),n]},
 save(){if(!LS.set("fs",this.root))toast("Storage full - changes kept for this session only")},
 ls(p){const n=this.node(p);if(!n||n.t!=="d")throw Error("Not a directory: "+p);return Object.entries(n.c).sort((a,b)=>a[1].t.localeCompare(b[1].t)||a[0].localeCompare(b[0]))},
 read(p){const n=this.node(p);if(!n||n.t!=="f")throw Error("No such file: "+p);return n.d},
 write(p,d){guard(p);const[par,n]=this.parent(p);if(!par||par.t!=="d"||!n)throw Error("Invalid path");if(par.c[n]&&par.c[n].t==="d")throw Error("Is a directory");if(this.size()+String(d).length>QUOTA)throw Error("Storage full (1 GB limit)");par.c[n]={t:"f",d,m:Date.now()};this.save()},
 mkdir(p){guard(p);const[par,n]=this.parent(p);if(!par||par.t!=="d"||!n)throw Error("Invalid path");if(par.c[n])throw Error("Already exists");par.c[n]={t:"d",c:{}};this.save()},
 rm(p){guard(p);const[par,n]=this.parent(p);if(!par||!par.c[n])throw Error("No such file");delete par.c[n];this.save()},
 mv(a,b){guard(a);guard(b);const[pa,na]=this.parent(a),[pb,nb]=this.parent(b);if(!pa||!pa.c[na]||!pb||pb.t!=="d"||!nb||b.startsWith(a+"/"))throw Error("Invalid path");if(pb.c[nb])throw Error("Target exists");pb.c[nb]=pa.c[na];delete pa.c[na];this.save()},
 size(n=this.root){return n.t==="f"?n.d.length:Object.values(n.c).reduce((s,x)=>s+this.size(x),0)}
};

/* ---------- Kernel: settings, permissions ---------- */
const PERMS={camera:["Camera","📷"],microphone:["Microphone","🎙"],location:["Location","📍"],notifications:["Notifications","🔔"],storage:["File storage","📁"],clipboard:["Clipboard","📋"]};
let S=Object.assign({wall:0,wifi:true,bt:false,air:false,focus:false,saver:false,night:false,vol:60},LS.get("s",{accent:"#a9c7ff",bright:100,pin:""}));
let grants=LS.get("grants",{files:{storage:"allow"},terminal:{storage:"allow"}});
let N=LS.get("n",[{app:"System",title:"Welcome to WebDroid",body:"Permissions, processes and a file system are live."}]);
function applyS(){document.documentElement.style.setProperty("--accent",S.accent);$("#dim").style.opacity=Math.min(.85,(100-S.bright)/100*.8+(S.saver?.12:0));$("#phone").style.background=WALLS[S.wall]||WALLS[0];$("#phone").style.filter=S.night?"sepia(.45) saturate(.9)":"";$("#ind").textContent=(S.air?"✈":S.wifi?"◉":"○")+(S.bt?" ᛒ":"")+(S.focus?" ◐":"")+(S.saver?" ⚡":"");LS.set("s",S)}
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("wos"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch{return"x"+btoa(s)}}
function dlg(title,val="",type="text"){return new Promise(res=>{const d=document.createElement("div");d.className="modal";d.innerHTML=`<form class="dlg"><h3 style="margin:0">${esc(title)}</h3><input class="field" type="${type}" value="${esc(val)}" autocomplete="off"><div class="row"><button type="button" class="btn secondary grow" data-c>Cancel</button><button class="btn grow">OK</button></div></form>`;const f=d.firstChild,i=f.querySelector("input");f.onsubmit=e=>{e.preventDefault();d.remove();res(i.value)};f.querySelector("[data-c]").onclick=()=>{d.remove();res(null)};$("#phone").appendChild(d);i.focus()})}
let pq=Promise.resolve();
function askPerm(app,perm){
 const a=APPS[app];
 if(!a||(!a.pkg&&!a.perms.includes(perm)))return Promise.resolve(false);
 const g=(grants[app]||{})[perm];
 if(g==="allow")return Promise.resolve(true);
 if(g==="deny")return Promise.resolve(false);
 pq=pq.then(()=>new Promise(res=>{
  const d=document.createElement("div");d.className="modal";
  d.innerHTML=`<div class="dlg"><div style="font-size:34px">${PERMS[perm][1]}</div><h3 style="margin:0">Allow ${esc(a.name)} to use ${PERMS[perm][0].toLowerCase()}?</h3><p class="small">You can change this later in Settings › App permissions.</p><button class="btn" data-r="a">Allow</button><button class="btn secondary" data-r="o">Only this time</button><button class="btn danger" data-r="d">Deny</button></div>`;
  d.onclick=e=>{const r=e.target.dataset.r;if(!r)return;d.remove();if(r!=="o"){(grants[app]=grants[app]||{})[perm]=r==="a"?"allow":"deny";LS.set("grants",grants)}res(r!=="d")};
  $("#phone").appendChild(d)}));
 return pq;
}

/* ---------- Kernel: processes and window manager ---------- */
const procs=new Map();let pidN=100,fg=null;
function makeSys(id){
 const s={toast,dlg,need:p=>askPerm(id,p),
  notify:async(t,b)=>{if(await askPerm(id,"notifications"))notify(APPS[id].name,t,b);else toast("Notifications blocked")},fs:{}};
 for(const m of["ls","read","write","mkdir","rm","mv"])s.fs[m]=async(...a)=>{if(!await askPerm(id,"storage"))throw Error("Permission denied: storage");return FS[m](...a)};
 return s}
function launch(id){
 if(!APPS[id])return;
 let p=[...procs.values()].find(x=>x.app===id),n=false;
 if(!p){n=true;p={pid:++pidN,app:id,t:Date.now(),mem:Math.round(20+Math.random()*60),el:document.createElement("section")};
  p.el.className="win";p.el.innerHTML=`<header class="hd"><h2>${APPS[id].icon} ${esc(APPS[id].name)}</h2></header><div class="body"></div>`;
  $("#wins").appendChild(p.el);procs.set(p.pid,p);
  try{p.inst=APPS[id].run(p.el.querySelector(".body"),makeSys(id),p)}catch(e){toast("App crashed: "+e.message);kill(p.pid);return}}
 show(p,n)}
function show(p,n){fg=p.pid;procs.forEach(x=>{const on=x===p;x.el.classList.toggle("on",on);const f=x.inst&&x.inst[on?"resume":"pause"];if(f&&!(n&&on))f()});$("#home").hidden=$("#dock").hidden=true;closeRecents();closeDrawer()}
function home(){fg=null;procs.forEach(x=>{x.el.classList.remove("on");x.inst&&x.inst.pause&&x.inst.pause()});$("#home").hidden=$("#dock").hidden=false;closeRecents();closeDrawer()}
function kill(pid){const p=procs.get(pid);if(!p)return;try{p.inst&&p.inst.destroy&&p.inst.destroy()}catch{}p.el.remove();procs.delete(pid);if(fg===pid)home();if(!$("#recents").hidden)renderRecents()}
function closeRecents(){$("#recents").hidden=true}
function renderRecents(){$("#recents").innerHTML=`<div class="row"><h3 class="grow" style="margin:0">Running apps</h3><button class="btn secondary" data-a="all">Close all</button></div><div style="height:12px"></div>`+([...procs.values()].map(p=>`<div class="card row" data-pid="${p.pid}"><span style="font-size:26px">${APPS[p.app].icon}</span><div class="grow"><b>${esc(APPS[p.app].name)}</b><div class="small">PID ${p.pid}</div></div><button class="btn danger" data-a="x">✕</button></div>`).join("")||'<p class="small" style="text-align:center;margin-top:40px">No running apps</p>')}
$("#recents").onclick=e=>{if(e.target.dataset.a==="all"){[...procs.keys()].forEach(kill);renderRecents();return}const c=e.target.closest("[data-pid]");if(!c)return;const p=procs.get(+c.dataset.pid);if(e.target.dataset.a==="x")kill(p.pid);else if(p)show(p)};

/* ---------- Notifications, shade ---------- */
function updateBell(){$("#bell").textContent=N.length?"🔔"+N.length:""}
function notify(app,title,body){N.unshift({app,title,body});N=N.slice(0,20);LS.set("n",N);updateBell();if(!S.focus)toast(app+": "+title)}

/* ---------- Lock screen and boot ---------- */
let locked=true,pinBuf="",fails=0,lockUntil=0,idle=Date.now();
function drawLock(){
 const d=new Date();
 $("#lock").innerHTML=`<div class="clk" id="lc" style="margin:0">${d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false})}</div><div class="small">${d.toLocaleDateString([],{weekday:"long",day:"numeric",month:"long"})}</div>`+
 (S.pin?`<div id="dots" style="font-size:26px;letter-spacing:8px;margin-top:24px;height:34px">○○○○</div><div class="small" id="lerr">Enter PIN</div><div class="pad">${["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k=>k?`<button data-k="${k}">${k}</button>`:"<span></span>").join("")}</div>`:`<button class="btn" style="margin-top:40px" data-k="go">Tap to unlock</button>`)}
function lock(){locked=true;pinBuf="";toggleShade(false);closeRecents();drawLock();$("#lock").hidden=false}
function unlock(){locked=false;lockLvl=0;fails=0;$("#lock").hidden=true;home()}
$("#lock").onclick=async e=>{
 const k=e.target.dataset.k;if(!k)return;
 if(k==="go")return unlock();
 const err=m=>$("#lerr").textContent=m,dots=()=>$("#dots").textContent="●".repeat(pinBuf.length)+"○".repeat(4-pinBuf.length);
 if(Date.now()<lockUntil){err("Too many attempts. Wait "+Math.ceil((lockUntil-Date.now())/1000)+"s");return}
 if(k==="⌫")pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=k;
 dots();
 if(pinBuf.length===4){const ok=await hash(pinBuf)===S.pin;pinBuf="";if(ok)return unlock();fails++;if(fails>=5){fails=0;const lk=15*Math.pow(2,Math.min(4,lockLvl++));lockUntil=Date.now()+lk*1000;err("Too many attempts. Locked "+lk+"s")}else err("Wrong PIN");dots()}};
addEventListener("pointerdown",()=>idle=Date.now(),true);
setInterval(()=>{if(!locked&&S.pin&&+S.lock&&Date.now()-idle>S.lock*1000)lock()},5000);
async function boot(){const b=$("#boot"),lg=b.querySelector("pre");
 for(const l of["kernel: init vfs ("+(FS.size()/1024).toFixed(1)+" KB)","kernel: mount /home /system","perm: load grants for "+Object.keys(grants).length+" apps","proc: scheduler ready","ui: compositor started"]){lg.textContent+=l+"\n";await new Promise(r=>setTimeout(r,200))}
 b.hidden=true;lock()}

function filesApp(el,sys){
 let cwd="/home/user",view=null;
 const ic=(n,x)=>x.t==="d"?"📁":/\.(jpe?g|png)$/i.test(n)?"🖼":"📄";
 async function draw(){view=null;let it;
  try{it=await sys.fs.ls(cwd)}catch(e){el.innerHTML=`<div class="card">${esc(e.message)}<p class="small">Grant storage in Settings › App permissions.</p></div>`;return}
  el.innerHTML=`<div class="row"><button class="btn secondary" data-a="up">↑</button><div class="grow small" style="word-break:break-all">${esc(cwd)}</div><button class="btn secondary" data-a="nd">＋📁</button><button class="btn secondary" data-a="nf">＋📄</button><label class="btn secondary">⬆<input type="file" multiple hidden data-up></label><button hidden data-a="rf"></button><label class="btn secondary">📦<input type="file" accept=".web,.json,.html,.htm,text/html,application/json" hidden data-imp></label></div><div style="height:10px"></div>`+(it.map(([n,x])=>`<div class="card row" data-n="${esc(n)}"><span style="font-size:22px">${ic(n,x)}</span><div class="grow"><b>${esc(n)}</b><div class="small">${x.t==="f"?x.d.length+" B":"Folder"}</div></div><button class="btn secondary" data-a="rn">✎</button><button class="btn danger" data-a="rm">✕</button></div>`).join("")||'<div class="small" style="text-align:center;margin-top:30px">Empty folder</div>')}
 async function open(n){const p=FS.norm(n,cwd),d=await sys.fs.read(p);view=p;
  el.innerHTML=d.startsWith("data:audio")?`<div class="small">${esc(p)}</div><audio controls src="${d}" style="width:100%;margin-top:12px"></audio>`:d.startsWith("data:video")?`<video controls playsinline src="${d}" style="width:100%;border-radius:12px"></video>`:d.startsWith("data:image")?`<img src="${d}" style="width:100%;border-radius:12px" alt=""><p class="small">${esc(p)}</p>`:`<div class="small">${esc(p)}</div><textarea class="field">${esc(d)}</textarea><div class="row"><button class="btn grow" data-a="sv">Save</button>${/\.(web|html?)$/i.test(p)?'<button class="btn secondary grow" data-a="ins">📦 Install as app</button>':""}</div>`}
 el.onclick=async e=>{
  const b=e.target.closest("[data-a]"),c=e.target.closest("[data-n]"),a=b&&b.dataset.a;
  try{
   if(a==="rf")return draw();if(a==="up"){cwd=FS.norm("..",cwd);return draw()}
   if(a==="nd"||a==="nf"){const n=await dlg(a==="nd"?"Folder name":"File name");if(n){const p=FS.norm(n,cwd);if(FS.node(p))throw Error("Already exists");a==="nd"?await sys.fs.mkdir(p):await sys.fs.write(p,"")}return draw()}
   if(a==="sv"){await sys.fs.write(view,el.querySelector("textarea").value);return toast("Saved")}
   if(!c)return;const n=c.dataset.n,p=FS.norm(n,cwd);
   if(a==="rm"){await sys.fs.rm(p);return draw()}
   if(a==="rn"){const m=await dlg("Rename",n);if(m)await sys.fs.mv(p,FS.norm(m,cwd));return draw()}
   if(FS.node(p).t==="d"){cwd=p;draw()}else open(n)
  }catch(x){toast(x.message)}};
 draw();return{back(){if(view){draw();return true}}}}
function notesApp(el,sys){
 const D="/home/user/Documents";let cur=null;
 async function list(){cur=null;let it;
  try{it=(await sys.fs.ls(D)).filter(([n,x])=>x.t==="f"&&n.endsWith(".txt"))}catch(e){el.innerHTML=`<div class="card">${esc(e.message)}<p class="small">Grant storage in Settings › App permissions.</p></div>`;return}
  el.innerHTML=`<button class="btn" data-n="">＋ New note</button><div style="height:10px"></div>`+it.map(([n,x])=>`<div class="card" data-n="${esc(n)}"><b>${esc(n)}</b><div class="small">${esc(x.d.slice(0,60))}</div></div>`).join("")}
 async function edit(n){cur=n||"note-"+Date.now()+".txt";let t="";try{t=await sys.fs.read(D+"/"+cur)}catch{}
  el.innerHTML=`<div class="small">${esc(cur)} · saved to Documents</div><textarea class="field">${esc(t)}</textarea><div class="row"><button class="btn grow" data-s>Save</button><button class="btn danger" data-d>Delete</button></div>`}
 el.onclick=async e=>{try{

 list();return{back(){if(cur){const t=el.querySelector("textarea");(t&&t.value.trim()?sys.fs.write(D+"/"+cur,t.value):Promise.resolve()).catch(()=>{}).then(list);return true}}}}
function cameraApp(el,sys){
 el.innerHTML=`<video class="cam" autoplay playsinline muted></video><p class="small msg" style="text-align:center">Starting…</p><button class="btn" style="width:100%">📸 Capture to Pictures</button>`;
 let stream,busy=false;const v=el.querySelector("video"),msg=el.querySelector(".msg");
 async function start(){if(stream||busy)return;busy=true;
  try{if(!await sys.need("camera")){msg.textContent="Camera permission denied. Change it in Settings › App permissions.";return}
   if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent="Camera API unavailable here.";return}
   stream=await navigator.mediaDevices.getUserMedia({video:true});v.srcObject=stream;msg.textContent="Camera ready"}
  catch(e){msg.textContent="Unavailable: "+e.message}finally{busy=false}}
 function stop(){stream&&stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null}
 el.querySelector("button").onclick=async()=>{
  if(!stream||!v.videoWidth)return toast("Camera not ready");
  const c=document.createElement("canvas"),w=Math.min(480,v.videoWidth);c.width=w;c.height=w*v.videoHeight/v.videoWidth;
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  try{await sys.fs.write("/home/user/Pictures/IMG_"+Date.now()+".jpg",c.toDataURL("image/jpeg",.6));await sys.notify("Photo saved","Saved to Pictures");toast("Saved to Pictures")}catch(e){toast(e.message)}};
 start();return{pause:stop,resume:start,destroy:stop}}
function termApp(el,sys){
 let cwd="/home/user";
 el.innerHTML=`<div class="term"></div><form class="row"><input class="field grow" style="margin:0" autocomplete="off" autocapitalize="off" placeholder="command"><button class="btn">Run</button></form>`;
 const out=el.querySelector(".term"),inp=el.querySelector("input");
 const w=t=>{out.textContent+=t+"\n";out.scrollTop=out.scrollHeight};
 w("Web OS shell · type help");
 el.querySelector("form").onsubmit=async e=>{e.preventDefault();const l=inp.value.trim();inp.value="";w("$ "+l);if(l)try{await run(l)}catch(x){w("error: "+x.message)}};
 async function run(l){
  let redir=null;const m=l.match(/^(.*?)\s*>\s*(\S+)$/);if(m){l=m[1];redir=m[2]}
  const[c,...a]=l.split(/\s+/),P=x=>FS.norm(x||".",cwd),o=[];
  switch(c){
   case"help":o.push("help pwd ls cd cat mkdir touch rm mv echo ps kill open perms df date lock clear");break;
   case"pwd":o.push(cwd);break;
   case"ls":o.push((await sys.fs.ls(P(a[0]))).map(([n,x])=>n+(x.t==="d"?"/":"")).join("  ")||"(empty)");break;
   case"cd":{const t=P(a[0]||"/home/user");await sys.fs.ls(t);cwd=t;break}
   case"cat":o.push((await sys.fs.read(P(a[0]))).slice(0,2000));break;
   case"mkdir":await sys.fs.mkdir(P(a[0]));break;
   case"touch":try{await sys.fs.read(P(a[0]))}catch{await sys.fs.write(P(a[0]),"")}break;
   case"rm":await sys.fs.rm(P(a[0]));break;
   case"mv":await sys.fs.mv(P(a[0]),P(a[1]));break;
   case"echo":o.push(a.join(" "));break;
   case"ps":o.push("PID   APP        UP(s)");procs.forEach(p=>o.push(p.pid+"  "+p.app.padEnd(10)+Math.round((Date.now()-p.t)/1000)));break;
   case"kill":if(!procs.has(+a[0]))throw Error("No such process");kill(+a[0]);break;
   case"open":if(!APPS[a[0]])throw Error("Unknown app");launch(a[0]);break;
   case"perms":for(const[id,g]of Object.entries(grants))o.push(id+": "+JSON.stringify(g));if(!o.length)o.push("(no grants)");break;
   case"df":o.push("Used "+(FS.size()/1024).toFixed(1)+" KB of ~5120 KB");break;
   case"date":o.push(new Date().toString());break;
   case"lock":lock();break;
   case"clear":out.textContent="";break;
   default:throw Error("command not found: "+c)}
  if(redir)await sys.fs.write(P(redir),o.join("\n"));else if(o.length)w(o.join("\n"))}
 return{}}

  el.innerHTML=`<div class="card"><b>System</b><div class="small">Processes ${procs.size} · FS ${(FS.size()/1024).toFixed(1)} KB${hm?" · JS heap "+(hm.usedJSHeapSize/1048576).toFixed(1)+" MB":""} · Uptime ${Math.round((Date.now()-T0)/1000)}s</div></div>`+
  [...procs.values()].map(p=>`<div class="card row"><div class="grow"><b>${APPS[p.app].icon} ${esc(APPS[p.app].name)}</b><div class="small">PID ${p.pid} · ${p.pid===fg?"foreground":"background"} · ${Math.round((Date.now()-p.t)/1000)}s · ~${p.mem} MB</div></div><button class="btn danger" data-p="${p.pid}">Kill</button></div>`).join("")}
 const go=()=>{stop();draw();t=setInterval(draw,1500)},stop=()=>clearInterval(t);
 el.onclick=e=>{const p=e.target.dataset.p;if(p)kill(+p)};
 go();return{pause:stop,resume:go,destroy:stop}}

emove":"Set"}</button></div><button class="btn secondary" style="margin-top:10px" data-a="lock">Lock now</button></div>

 el.oninput=e=>{const k=e.target.dataset.k;if(k){S[k]=k==="bright"?+e.target.value:e.target.value;applyS()}};

 el.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const[a,x]=b.dataset.a.split(':');

function recApp(el,sys){el.innerHTML=`<div style="text-align:center"><div style="font-size:70px">🎙</div><p class="small" id="rm">Tap record to start</p><button class="btn" data-a="r" style="width:100%">● Record</button></div><h3>Recordings</h3><div id="rl"></div>`;
 let mr=null,ch=[],tmr,sec=0;const q=s=>el.querySelector(s);
 async function list(){let it=[];try{it=(await sys.fs.ls("/home/user/Downloads")).filter(([n,x])=>x.t==="f"&&x.d.startsWith("data:audio"))}catch{}q("#rl").innerHTML=it.map(([n,x])=>`<div class="card"><b>${esc(n)}</b><audio controls src="${x.d}" style="width:100%;margin-top:8px"></audio></div>`).join("")||'<p class="small">None yet</p>'}

function termApp(el,sys){let cwd="/home/user",H=[],hi=0;
 el.innerHTML=`<div class="term"></div><form class="row"><input class="field grow" style="margin:0" autocomplete="off" autocapitalize="off" placeholder="command"><button type="button" class="btn secondary" data-u>▲</button><button class="btn">Run</button></form>`;
 const out=el.querySelector(".term"),inp=el.querySelector("input");
 const w=t=>{out.textContent+=t+"\n";out.scrollTop=out.scrollHeight};
 const hist=d=>{if(!H.length)return;hi=Math.max(0,Math.min(H.length,hi+d));inp.value=H[hi]||""};
 el.querySelector("[data-u]").onclick=()=>hist(-1);
 inp.onkeydown=e=>{if(e.key==="ArrowUp"){e.preventDefault();hist(-1)}else if(e.key==="ArrowDown"){e.preventDefault();hist(1)}};
 w("Web OS shell 3 · simulated, type help");
 const P=x=>FS.norm(x||".",cwd),nf=async f=>(await sys.fs.read(P(f))).split("\n");
 async function cmd(c,a,inp,pp){switch(c){
  case"help":return["help pwd ls cd cat mkdir touch rm mv cp echo grep wc head ps top kill open apps perms df free uptime uname whoami hostname neofetch history date lock clear","pipes: ls | grep txt    redirect: echo hi > a.txt"];
  case"pwd":return[cwd];
  case"ls":return(await sys.fs.ls(P(a[0]))).map(([n,x])=>n+(x.t==="d"?"/":""));
  case"cd":{const t=P(a[0]||"/home/user");await sys.fs.ls(t);cwd=t;return[]}
  case"cat":return(await sys.fs.read(P(a[0]))).slice(0,2000).split("\n");
  case"mkdir":await sys.fs.mkdir(P(a[0]));return[];
  case"touch":try{await sys.fs.read(P(a[0]))}catch{await sys.fs.write(P(a[0]),"")}return[];
  case"rm":await sys.fs.rm(P(a[0]));return[];
  case"mv":await sys.fs.mv(P(a[0]),P(a[1]));return[];
  case"cp":await sys.fs.write(P(a[1]),await sys.fs.read(P(a[0])));return[];
  case"echo":return[a.join(" ")];
  case"grep":return(pp?inp:await nf(a[1])).filter(x=>x.includes(a[0]));
  case"wc":return[(pp?inp:await nf(a[0])).length+" lines"];
  case"head":return(pp?inp:await nf(a[0])).slice(0,5);
  case"ps":return["PID   APP        UP(s)",...[...procs.values()].map(p=>p.pid+"  "+p.app.padEnd(10)+Math.round((Date.now()-p.t)/1000))];
  case"top":return["PID   APP        MEM(MB) STATE",...[...procs.values()].map(p=>p.pid+"  "+p.app.padEnd(10)+String(p.mem).padEnd(8)+(p.pid===fg?"fg":"bg"))];
  case"kill":if(!procs.has(+a[0]))throw Error("No such process");kill(+a[0]);return[];
  case"open":if(!APPS[a[0]])throw Error("Unknown app");launch(a[0]);return[];
  case"apps":return Object.keys(APPS).map(i=>i+(INST.includes(i)?"":" (not installed)"));
  case"perms":return Object.entries(grants).map(([i,g])=>i+": "+JSON.stringify(g));
  case"df":return["Used "+(FS.size()/1024).toFixed(1)+" KB of 102400 KB"];
  case"free":{const h=performance.memory;return[h?"JS heap: "+(h.usedJSHeapSize/1048576).toFixed(1)+" / "+(h.jsHeapSizeLimit/1048576).toFixed(0)+" MB":"memory info unavailable"]}
  case"uptime":return["up "+Math.round((Date.now()-T0)/1000)+"s, "+procs.size+" processes"];
  case"uname":return["WebOS 3.1 (JavaScript, "+navigator.platform+")"];
  case"whoami":return["user"];
  case"hostname":return["webos"];
  case"neofetch":return["user@webos","OS: Web OS 3.1 (simulated)","Kernel: JavaScript (browser)","Apps: "+INST.length+" installed","Procs: "+procs.size,"Disk: "+(FS.size()/1024).toFixed(1)+" KB"];
  case"install":{const pk=parsePkg(await sys.fs.read(P(a[0])),a[0]);if(!await confirmPkg(pk))return["cancelled"];installPkg(pk);return["installed "+pk.name+" ("+pk.id+")"]}
  case"pkgs":return PKGS.map(p=>p.id+" v"+p.version)||[];
  case"history":return H.map((x,i)=>(i+1)+"  "+x);
  case"date":return[new Date().toString()];
  case"lock":lock();return[];
  case"clear":out.textContent="";return[];
  default:throw Error("command not found: "+c)}}
 async function run(l){let redir=null;const m=l.match(/^(.*?)\s*>\s*(\S+)$/);if(m){l=m[1];redir=m[2]}
  let o=[];const st=l.split(/\s*\|\s*/);for(let k=0;k<st.length;k++){const[c,...a]=st[k].split(/\s+/);o=await cmd(c,a,o,k>0)}
  if(redir)await sys.fs.write(P(redir),o.join("\n"));else if(o.length)w(o.join("\n"))}
 el.querySelector("form").onsubmit=async e=>{e.preventDefault();const l=inp.value.trim();inp.value="";if(l){H.push(l);hi=H.length}w("$ "+l);if(l)try{await run(l)}catch(x){w("error: "+x.message)}};
 return{}}
